appId: com.jarvis.assistant
productName: JARVIS
copyright: Copyright © 2026 Jarvis Team
directories:
  output: release
  buildResources: build
files:
  - dist
  - dist-electron
  - package.json
  - backend/**
  - "!backend/__pycache__/**"
  - "!backend/**/__pycache__/**"
  - "!**/*.pyc"
asar: true
extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*.py"
      - "requirements.txt"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
mac:
  target: [zip]
  category: public.app-category.productivity
win:
  target: [nsis, portable, zip]
  artifactName: JARVIS-${version}-${os}-${arch}.${ext}
linux:
  target: [tar.gz, deb, zip]
  category: Utility
  maintainer: Jarvis Team
  artifactName: JARVIS-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
